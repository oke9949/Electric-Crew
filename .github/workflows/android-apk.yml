name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/android-release.mjs'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'public/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/android-release.mjs'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'public/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read and validate application version
        id: version
        shell: bash
        run: node .github/scripts/android-release.mjs version >> "$GITHUB_OUTPUT"

      - name: Validate published version history
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          mapfile -t RELEASE_TAGS < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          node .github/scripts/android-release.mjs validate-history "$APP_VERSION" "${RELEASE_TAGS[@]}"

      - name: Build web application
        run: pnpm build

      - name: Generate Android project
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          node .github/scripts/android-release.mjs configure android/app/build.gradle "$APP_VERSION" "$VERSION_CODE"
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Generate branded launcher icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 -o android/app/src/main/res/drawable-nodpi/ec_launcher.png public/ec-mark.svg
          sed -i 's#@mipmap/ic_launcher_round#@drawable/ec_launcher#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher#@drawable/ec_launcher#g' android/app/src/main/AndroidManifest.xml

      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Validate release-signing secrets
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required Android release-signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode and verify release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/electric-crew-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release-signed APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare and verify APK
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi
          APK_FILE="Electric-Crew-${APP_VERSION}.apk"
          cp "$SOURCE_APK" "$APK_FILE"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electric-Crew-${{ steps.version.outputs.app_version }}-APK
          path: Electric-Crew-${{ steps.version.outputs.app_version }}.apk
          if-no-files-found: error

      - name: Publish immutable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          RELEASE_TAG="android-v${APP_VERSION}"
          APK_FILE="Electric-Crew-${APP_VERSION}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving its APK asset unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "Electric Crew ${APP_VERSION} Android" \
            --notes "Tartós Electric Crew kiadási kulccsal aláírt Android APK."
