name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'public/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read application version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$APP_VERSION"
          VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Synchronize dependency lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- pnpm-lock.yaml
            git commit -m "chore: synchronize Capacitor lockfile"
            git push origin HEAD:main
          fi

      - name: Build web application
        run: pnpm build

      - name: Generate Android project
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Generate branded launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 -o android/app/src/main/res/drawable-nodpi/ec_launcher.png public/ec-mark.svg
          sed -i 's#@mipmap/ic_launcher_round#@drawable/ec_launcher#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher#@drawable/ec_launcher#g' android/app/src/main/AndroidManifest.xml

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Electric-Crew-${APP_VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electric-Crew-${{ env.APP_VERSION }}-APK
          path: Electric-Crew-${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="android-v${APP_VERSION}"
          APK_FILE="Electric-Crew-${APP_VERSION}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --title "Electric Crew ${APP_VERSION} Android" \
              --notes "Telepíthető Android APK az Electric Crew ${APP_VERSION} kiadásához."
          fi
