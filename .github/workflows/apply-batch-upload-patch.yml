name: Apply batch upload integration

on:
  push:
    branches: ["chatgpt/batch-ai-document-upload"]
    paths: [".github/workflows/apply-batch-upload-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/batch-ai-document-upload
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-batch-upload-patch.mjs
      - run: git diff --check
      - name: Commit integration and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm scripts/apply-batch-upload-patch.mjs .github/workflows/apply-batch-upload-patch.yml
          git commit -m "feat: integrate batch AI document upload"
          git push origin HEAD:chatgpt/batch-ai-document-upload
